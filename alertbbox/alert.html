<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juni Arena - Final Box</title>
  <style>
    body {
      background: radial-gradient(circle at top left, #2d0b3a, transparent),
                  radial-gradient(circle at bottom right, #0d1117, #161b22);
      background-color: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .bg-name {
      position: absolute;
      font-size: 15vw;
      font-weight: 900;
      color: rgba(0, 255, 127, 0.02);
      text-transform: uppercase;
      z-index: -1;
      user-select: none;
    }

    .arena-card {
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(0, 255, 127, 0.4);
      border-radius: 30px;
      padding: 50px 35px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 255, 127, 0.1), 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .profile-container {
      display: inline-block;
      border: 3px solid #00ff7f;
      border-radius: 50%;
      padding: 5px;
      margin-bottom: 25px;
      box-shadow: 0 0 25px rgba(0, 255, 127, 0.7), inset 0 0 10px rgba(0, 255, 127, 0.4);
    }

    .profile-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .username {
      font-size: 2.2rem;
      font-weight: 800;
      color: #00ff7f;
      margin-bottom: 35px;
      text-shadow: 0 0 15px rgba(0, 255, 127, 0.5);
    }

    .btn-unlock {
      background: linear-gradient(90deg, #00ffcc, #00d2ff);
      border: none;
      color: #000;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 50px;
      padding: 15px;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 15px;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-unlock:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
    }

    .btn-option {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #c9d1d9;
      border-radius: 15px;
      flex: 1;
      padding: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-option:hover {
      background: rgba(0, 255, 127, 0.1);
      border-color: #00ff7f;
      color: #fff;
    }

    .btn-exit {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.3);
      color: #ff4d4d;
      border-radius: 15px;
      width: 100%;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-exit:hover {
      background: #ff4d4d;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="bg-name" style="top: 10%; left: 5%;">JUNI</div>
  <div class="bg-name" style="bottom: 10%; right: 5%;">JUNI</div>

  <div class="arena-card">
    <div class="profile-container">
      <img src="/images/teampick/juni.jpg" alt="Muhammad Junaid Hassan" class="profile-img">
    </div>
    
    <div class="username">Uncommon_Juni</div>

    <!-- Fix 1: Direct link for testing -->
    <button class="btn-unlock" onclick="goHome()">Unlock Arena Stats</button>

    <div class="btn-row">
      <button class="btn-option">Info</button>
      <button class="btn-option">Feedback</button>
    </div>

    <!-- Fix 2: Same function call for Exit -->
    <button class="btn-exit" onclick="goHome()">X Exit Arena</button>
  </div>

  <script>
    function goHome() {
      // Local development ke liye sirf filename kaafi hota hai
      window.location.href = "/index.html"; 
    }
  </script>

</body>
</html>
